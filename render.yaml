services:
  - type: web
    name: irone-key-system
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: irone-key-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: KEY_PREFIX
        value: IRONE
      - key: DATABASE_FILE
        value: /var/data/keys.db
